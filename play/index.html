<!DOCTYPE html>
<html lang="ko">
<head>
<style id="awm-pp">html.awm-gated body>*:not(#natas-header){visibility:hidden!important}</style>
<script>try{if(localStorage.getItem('awm_subscribed')!=='1')document.documentElement.className+=(document.documentElement.className?' ':'')+'awm-gated';}catch(_){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>플레이 — 모두의 게임</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="/assets/css/natas.css">
  <style>
    .player-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .player-bar h1{margin:0;font-size:22px;font-weight:800}
    .player-frame{position:relative;width:100%;height:min(78vh,760px);border:1px solid var(--line);
      border-radius:16px;overflow:hidden;background:#000}
    .player-frame iframe{width:100%;height:100%;border:0;display:block;background:#000}
    .player-note{color:var(--muted2);font-size:12.5px;margin-top:10px}
    .player-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  </style>
<script src="/assets/js/awm-gate.js" defer></script>
</head>
<body>
  <div id="natas-header"></div>

  <main class="wrap">
    <div class="crumb" id="crumb"><a href="/">← 포털 홈</a></div>
    <div class="player-bar">
      <h1 id="title">게임</h1>
      <span class="badge badge-mit" id="lic" style="display:none"></span>
      <div class="player-actions">
        <a class="btn" id="src-link" href="#" target="_blank" rel="noopener" style="display:none">소스(GitHub) ↗</a>
        <a class="btn" id="full-link" href="#" target="_blank" rel="noopener">전체화면 ↗</a>
      </div>
    </div>
    <div class="player-frame"><iframe id="frame" title="game" allowfullscreen sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms allow-modals"></iframe></div>
    <p class="player-note">게임 저작권/라이선스는 원저작자에게 있습니다. 진행 상황은 이 브라우저에 저장됩니다.</p>
  </main>

  <div id="natas-footer"></div>
  <script src="/assets/js/natas.js" defer></script>
  <script>
    (function(){
      var THEME = { "arcade":"아케이드","puzzle":"퍼즐","board-card":"보드·카드",
        "action-shooter":"액션·슈팅","strategy-sim":"전략·시뮬","casual":"캐주얼" };
      var q = new URLSearchParams(location.search);
      var src = q.get("src") || "";
      var title = q.get("t") || "게임";
      var theme = q.get("theme") || "";
      var license = q.get("lic") || "";
      var source = q.get("repo") || "";
      // 동일 출처(절대경로)만 허용 — 외부 임베드 차단
      if (!/^\/(?!\/)[A-Za-z0-9._\-\/]*$/.test(src)) { src = "about:blank"; }
      document.getElementById("title").textContent = title;
      document.title = title + " — 모두의 게임";
      document.getElementById("frame").src = src;
      document.getElementById("full-link").href = src;
      if (theme && THEME[theme]) {
        document.getElementById("crumb").innerHTML =
          '<a href="/">포털 홈</a> · <a href="/'+theme+'/">'+THEME[theme]+'</a>';
      }
      if (license){ var l=document.getElementById("lic"); l.textContent=license; l.style.display="inline-block"; }
      if (source){ var s=document.getElementById("src-link"); s.href=source; s.style.display="inline-flex"; }
    })();
  </script>
</body>
</html>
