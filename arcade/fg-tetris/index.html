<!DOCTYPE html>
<html lang="ko">
<head>
  <script>if(window.top===window.self){location.replace('/play/?src='+encodeURIComponent(location.pathname));}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>FG TETRIS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f1a'/%3E%3Crect x='6' y='6' width='9' height='9' fill='%2322d3ee'/%3E%3Crect x='17' y='6' width='9' height='9' fill='%23a855f7'/%3E%3Crect x='6' y='17' width='9' height='9' fill='%23facc15'/%3E%3Crect x='17' y='17' width='9' height='9' fill='%23ef4444'/%3E%3C/svg%3E" />
  <meta name="description" content="FG TETRIS — 웹에서 바로 즐기는 테트리스. Easy · Hard · Training · Multi 모드 지원." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg-layer"></div>
  <div id="app">

    <!-- ===================== MENU ===================== -->
    <section id="screen-menu" class="screen">
      <div class="menu-card">
        <h1 class="logo">FG<span>TETRIS</span></h1>
        <p class="tagline">웹 에디션 · 키보드 또는 터치로 플레이</p>

        <div class="mode-grid">
          <button class="mode-btn easy" data-mode="easy">
            <span class="m-title">EASY</span>
            <span class="m-sub">초보자용 · 느린 속도</span>
          </button>
          <button class="mode-btn hard" data-mode="hard">
            <span class="m-title">HARD</span>
            <span class="m-sub">숙련자용 · 빠른 속도</span>
          </button>
          <button class="mode-btn training" data-mode="training">
            <span class="m-title">TRAINING</span>
            <span class="m-sub">연습 · 게임오버 없음</span>
          </button>
          <button class="mode-btn multi" data-mode="multi">
            <span class="m-title">MULTI</span>
            <span class="m-sub">2인 대전 · 같은 키보드</span>
          </button>
        </div>

        <div class="sound-row">
          <button id="btn-sfx" class="sound-toggle">🔊 효과음</button>
          <button id="btn-music" class="sound-toggle">🎵 음악</button>
        </div>

        <button id="btn-leaderboard" class="ghost-btn">🏆 리더보드</button>

        <div class="controls-hint">
          <span><b>←→</b> 이동</span>
          <span><b>↑/X</b> 회전</span>
          <span><b>↓</b> 소프트드롭</span>
          <span><b>Space</b> 하드드롭</span>
          <span><b>C</b> 홀드</span>
          <span><b>P</b> 일시정지</span>
        </div>
      </div>
    </section>

    <!-- ===================== GAME ===================== -->
    <section id="screen-game" class="screen hidden">
      <header class="game-top">
        <button id="btn-quit" class="top-btn">‹ 메뉴</button>
        <span id="mode-tag" class="mode-tag">EASY</span>
        <div class="top-right">
          <button id="btn-sound" class="top-btn">🔊</button>
          <button id="btn-pause" class="top-btn">❚❚</button>
        </div>
      </header>

      <div id="game-wrap" class="game-wrap">
        <!-- Player 1 -->
        <div class="player">
          <div class="side left">
            <div class="panel">
              <div class="panel-label">HOLD</div>
              <canvas id="hold1" width="96" height="96"></canvas>
            </div>
            <div class="stat"><span>SCORE</span><b id="hud-score">0</b></div>
            <div class="stat"><span>LINES</span><b id="hud-lines">0</b></div>
            <div class="stat"><span>LEVEL</span><b id="hud-level">1</b></div>
          </div>
          <canvas id="board1" class="board" width="300" height="600"></canvas>
          <div class="side right">
            <div class="panel">
              <div class="panel-label">NEXT</div>
              <canvas id="next1" width="96" height="96"></canvas>
            </div>
            <div class="p-tag">P1</div>
          </div>
        </div>

        <!-- Player 2 (multi only) -->
        <div id="p2-panel" class="player hidden">
          <div class="side left">
            <div class="panel">
              <div class="panel-label">HOLD</div>
              <canvas id="hold2" width="96" height="96"></canvas>
            </div>
            <div class="stat"><span>SCORE</span><b id="hud2-score">0</b></div>
            <div class="stat"><span>LINES</span><b id="hud2-lines">0</b></div>
            <div class="stat"><span>LEVEL</span><b id="hud2-level">1</b></div>
          </div>
          <canvas id="board2" class="board" width="300" height="600"></canvas>
          <div class="side right">
            <div class="panel">
              <div class="panel-label">NEXT</div>
              <canvas id="next2" width="96" height="96"></canvas>
            </div>
            <div class="p-tag p2">P2</div>
          </div>
        </div>
      </div>

      <!-- Touch controls (single player / mobile) -->
      <div id="touch-controls" class="touch-controls hidden">
        <div class="tc-row">
          <button id="btn-hold" class="tc-btn small">HOLD</button>
          <button id="btn-rotate" class="tc-btn">⟳</button>
          <button id="btn-drop" class="tc-btn small">DROP</button>
        </div>
        <div class="tc-row">
          <button id="btn-left" class="tc-btn">◀</button>
          <button id="btn-down" class="tc-btn">▼</button>
          <button id="btn-right" class="tc-btn">▶</button>
        </div>
      </div>

      <p id="multi-keys" class="multi-keys">P1: 방향키 + Space(드롭) + C(홀드) &nbsp;|&nbsp; P2: WASD + E(드롭) + Tab(홀드)</p>

      <!-- Pause overlay -->
      <div id="overlay-pause" class="overlay hidden">
        <div class="overlay-card">
          <h2>PAUSED</h2>
          <button id="resume-btn" class="primary-btn">계속하기</button>
          <button id="pause-quit-btn" class="ghost-btn">메뉴로</button>
        </div>
      </div>

      <!-- Game over overlay -->
      <div id="overlay-gameover" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="go-title">GAME OVER</h2>
          <p id="go-detail" class="go-detail"></p>
          <div id="score-form" class="score-form hidden">
            <label>이름 입력 (리더보드 등록)</label>
            <input id="score-name" maxlength="8" placeholder="AAA" autocomplete="off" />
          </div>
          <div class="overlay-actions">
            <button id="go-retry" class="primary-btn">다시하기</button>
            <button id="go-menu" class="ghost-btn">메뉴로</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== LEADERBOARD ===================== -->
    <section id="screen-leaderboard" class="screen hidden">
      <div class="lb-card">
        <h2 class="lb-title">🏆 LEADERBOARD</h2>
        <div class="lb-tabs">
          <button class="lb-tab active" data-lbmode="easy">EASY</button>
          <button class="lb-tab" data-lbmode="hard">HARD</button>
          <button class="lb-tab" data-lbmode="training">TRAINING</button>
        </div>
        <table class="lb-table">
          <thead>
            <tr><th>#</th><th>NAME</th><th>SCORE</th><th>LINES</th></tr>
          </thead>
          <tbody id="lb-body"></tbody>
        </table>
        <button id="lb-back" class="ghost-btn">‹ 메뉴로</button>
      </div>
    </section>

  </div>
  <script src="game.js"></script>
</body>
</html>
